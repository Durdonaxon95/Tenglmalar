<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">

<title>Tenglamalar o‘yini</title>
<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17162a;--card:#232240;--tx:#f1efff;--mut:#a9a6c9;--hl:#4a4320;--bd:#3a3860;--ok:#4cd68a;--no:#ff7a8a}}
:root[data-theme="dark"]{--bg:#17162a;--card:#232240;--tx:#f1efff;--mut:#a9a6c9;--hl:#4a4320;--bd:#3a3860;--ok:#4cd68a;--no:#ff7a8a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.5 "Trebuchet MS",Verdana,sans-serif}
.w{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:28px;margin:8px 0;text-align:center}
.sub{text-align:center;color:var(--mut);margin:0 0 14px}
.tabs{display:flex;gap:8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:5}
.tabs button{flex:1;border:0;border-radius:14px;padding:10px 2px;font:inherit;font-size:13px;font-weight:700;color:#fff;opacity:.5;cursor:pointer}
.tabs button.on{opacity:1;transform:scale(1.04)}
.card{background:var(--card);border:2px solid var(--bd);border-radius:18px;padding:14px;margin:12px 0}
.rule{border-left:8px solid var(--c);}
.card h2{margin:0 0 6px;font-size:20px}
.big{font-size:20px;font-weight:700;background:var(--hl);border-radius:10px;padding:6px 10px;display:inline-block;margin:4px 0}
.step{background:var(--hl);border-radius:12px;padding:8px 12px;margin:6px 0;animation:p .3s}
.step small{display:block;color:var(--mut)}
@keyframes p{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
button.act{border:0;border-radius:12px;background:var(--c);color:#fff;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;margin:4px 4px 0 0}
.eq{font-size:26px;font-weight:800;text-align:center;margin:8px 0}
input{font:inherit;font-size:22px;width:110px;padding:8px;border-radius:12px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);text-align:center}
.msg{font-weight:700;margin-top:8px}
.ok{color:var(--ok)}.no{color:var(--no)}
.score{text-align:center;font-weight:800;font-size:18px}
.seesaw{display:flex;justify-content:center;gap:10px;align-items:center;font-weight:800;font-size:20px}
.seesaw span{background:var(--hl);padding:8px 12px;border-radius:12px}
.top{display:flex;justify-content:space-between;font-weight:800;font-size:18px}
.bar{height:12px;background:var(--bd);border-radius:8px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--c,#1f9d55);transition:width .4s}
.hero{display:flex;gap:12px;align-items:center}.av{font-size:48px}
.stage{display:flex;gap:10px;align-items:center;border-left:8px solid var(--c)}.stage .gi{flex:1}.ic{font-size:36px}.lock{opacity:.5}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}.grid div{background:var(--hl);border-radius:12px;padding:8px 2px;text-align:center}.grid b{display:block;font-size:19px}.grid small{color:var(--mut);font-size:12px}
.pop{animation:p .4s}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:5px;border-bottom:1px solid var(--bd);text-align:left}
textarea{width:100%;height:120px;font:13px monospace;background:var(--bg);color:var(--tx);border:2px solid var(--bd);border-radius:10px}
.bg{display:inline-block;text-align:center;width:30%;margin:4px;font-size:12px;vertical-align:top}.bg span{font-size:30px;display:block}
details summary{cursor:pointer;font-weight:700}.big2{width:100%;font-size:19px}
.fl{stroke-dasharray:7 5;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-24}}.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-5px)}}
a.lnk{border-radius:12px;background:var(--c);color:#fff;padding:10px 16px;font-weight:700;display:inline-block;text-decoration:none;margin:4px 4px 0 0}#ts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#23213a;color:#fff;padding:10px 16px;border-radius:12px;opacity:0;transition:.3s;pointer-events:none;z-index:9;text-align:center}

var L=[
{c:"#1f9d55",n:"1-daraja",t:"Sodda tenglamalar: x ni yolg‘iz qoldiramiz",

ex:{q:"x + 5 = 12",s:[["x = 12 − 5","5 devordan o‘tdi, + − ga aylandi"],["x = 7 ✅","12 − 5 = 7. Tekshiramiz: 7 + 5 = 12 ✔"]]},
gen:function(){var t=r(0,3),x,a,b,c;if(t==0){x=r(1,15);a=r(2,15);return{q:"x + "+a+" = "+(x+a),x:x,s:["x = "+(x+a)+" − "+a,"x = "+x]}}if(t==1){b=r(1,15);a=r(2,12);x=a+b;return{q:"x − "+a+" = "+b,x:x,s:["x = "+b+" + "+a,"x = "+x]}}if(t==2){a=r(2,9);x=r(1,12);return{q:a+"x = "+a*x,x:x,s:["x = "+a*x+" : "+a,"x = "+x]}}if(t==3){a=r(2,9);b=r(1,9);return{q:"x : "+a+" = "+b,x:a*b,s:["x = "+b+" · "+a,"x = "+a*b]}}}},
{c:"#14a3a3",n:"2-daraja",t:"Ikki amalli tenglamalar",
rule:["🪜 Bu yerda x ni <b>ikki qadamda</b> topamiz.","1️⃣ Avval x dan ajralgan <b>sonni</b> (+4 yoki −4) devordan o‘tkazamiz — ishorasi o‘zgaradi.","2️⃣ Keyin x oldidagi songa <b>bo‘lamiz</b>: 3x = 15 → x = 15 : 3.","Tekshirish: 3·5 + 4 = 19 ✔"],
ex:{q:"3x + 4 = 19",s:[["3x = 19 − 4","4 devordan o‘tdi, + − ga aylandi"],["3x = 15","19 − 4 = 15"],["x = 15 : 3","3 ko‘paytuvchi edi, bo‘lish bo‘ldi"],["x = 5 ✅","Tekshiramiz: 3·5 + 4 = 19 ✔"]]},
gen:function(){var a=r(2,9),x=r(1,12),b,c;if(r(0,1)){b=r(1,20);c=a*x+b;return{q:a+"x + "+b+" = "+c,x:x,s:[a+"x = "+c+" − "+b,a+"x = "+a*x,"x = "+a*x+" : "+a+" = "+x]}}b=r(1,a*x-1);c=a*x-b;return{q:a+"x − "+b+" = "+c,x:x,s:[a+"x = "+c+" + "+b,a+"x = "+a*x,"x = "+a*x+" : "+a+" = "+x]}}},
{c:"#2f6fed",n:"3-daraja",t:"Harflar bir uyga, sonlar bir uyga!",
rule:["Tenglamada x (noma’lum) ikki tomonda bo‘lsa, kichkina x ni doim <b>katta x</b> ning oldiga mehmonga boradi.","🔑 <b>Eng muhim sir:</b> son yoki harf tenglik (=) devoridan o‘tsa, <b>ishorasi o‘zgaradi</b>: (+) bo‘lsa (−) ga, (−) bo‘lsa (+) ga."],
ex:{q:"5x + 12 = 3x + 28",s:[["5x − 3x + 12 = 28","3x chapga o‘tdi, ishorasi o‘zgardi (+ → −)"],["5x − 3x = 28 − 12","12 o‘ngga o‘tdi, ishorasi o‘zgardi"],["2x = 16","Hisoblaymiz: 5x − 3x = 2x, 28 − 12 = 16"],["x = 8 ✅","16 : 2 = 8"]]},
gen:function(){var x=r(1,10),c=r(2,9),k=r(1,5),a=c+k,b=r(3,20),d=k*x+b;return{q:a+"x + "+b+" = "+c+"x + "+d,x:x,s:[a+"x − "+c+"x = "+d+" − "+b,k+"x = "+(d-b),"x = "+(d-b)+" : "+k+" = "+x]}}},
{c:"#ff7a3d",n:"4-daraja",t:"Mehmon kutish (qavslarni ochish)",

ex:{q:"3(x + 4) = x + 20",s:[["3·x + 3·4 = x + 20","3 ni avval x ga, keyin 4 ga ko‘paytiramiz"],["3x + 12 = x + 20","Endi oldingi qoidani ishlatamiz"],["3x − x = 20 − 12","x chapga, 12 o‘ngga — ishoralar o‘zgardi!"],["2x = 8","Hisoblaymiz"],["x = 4 ✅","8 : 2 = 4"]]},
gen:function(){var x=r(1,9),m=r(2,6),p=r(2,9),c=r(1,m-1),d=(m-c)*x+m*p;return{q:m+"(x + "+p+") = "+c+"x + "+d,x:x,s:[m+"x + "+m*p+" = "+c+"x + "+d,(m-c)+"x = "+d+" − "+m*p,(m-c)+"x = "+(d-m*p),"x = "+(d-m*p)+" : "+(m-c)+" = "+x]}}},
{c:"#8a4fff",n:"5-daraja",t:"Ikkita mehmonxona (ikkita qavs)",
rule:["🏨 Avval <b>hamma qavslarni</b> ochib olamiz. Tenglikning ikki tomonida ham qavs bo‘lsa, ikkala tomonni ham o‘z qoidasiga ko‘ra ochamiz.","O‘xshash sonlarni o‘zaro qo‘shib olamiz: <b>son ± son</b>, <b>harf ± harf</b>.","Keyin oddiy tenglamaga keltiramiz."],

gen:function(){for(;;){var x=r(1,9),m=r(3,7),n=r(2,m-1),p=r(1,6),q=r(1,8),rr=(m-n)*x+m*p-n*q;if(rr>0&&rr<30)return{q:m+"(x + "+p+") = "+n+"(x + "+q+") + "+rr,x:x,s:[m+"x + "+m*p+" = "+n+"x + "+n*q+" + "+rr,m+"x + "+m*p+" = "+n+"x + "+(n*q+rr),(m-n)+"x = "+(n*q+rr)+" − "+m*p,(m-n)+"x = "+((m-n)*x),"x = "+((m-n)*x)+" : "+(m-n)+" = "+x]}}}},
{c:"#e0368f",n:"6-daraja",t:"Minus qavs oldida: ishora almashtiruvchi!",
rule:["➖ Qavs oldida <b>minus</b> bo‘lsa, u qavs ichidagi <b>HAMMA</b> ishoralarni teskariga aylantiradi.","−2·(x + 3) = −2x − 6 (ikkalasi ham minus bo‘ldi!). Ichida minus bo‘lsa: −2·(x − 3) = −2x + 6","Eng ko‘p xato: faqat birinchi sonni o‘zgartirib, ikkinchisini unutish. Ehtiyot bo‘ling!"],

gen:function(){for(;;){var x=r(1,9),m=r(3,8),n=r(2,m-1),p=r(2,8),q=r(1,6),k=m*p-n*q,c=(m-n)*x+k;if(k>0&&c<60)return{q:m+"(x + "+p+") − "+n+"(x + "+q+") = "+c,x:x,s:[m+"x + "+m*p+" − "+n+"x − "+n*q+" = "+c,(m-n)+"x + "+k+" = "+c,(m-n)+"x = "+c+" − "+k,(m-n)+"x = "+(m-n)*x,"x = "+(m-n)*x+" : "+(m-n)+" = "+x]}}}}

function r(a,b){return a+Math.floor(Math.random()*(b-a+1))}
["🌱","🪜","⚖️","🎁","🏨","🧙"].forEach(function(e,i){L[i].ic=e});

function tr(s,k){if(k==1)s.pop();return s}
L[0].gen=function(){var t=r(0,5),a,b,x,q,s;
if(t<2){x=r(1,40);a=r(2,40);q=t?a+" + x = "+(x+a):"x + "+a+" = "+(x+a);s=["x = "+(x+a)+" − "+a,"x = "+x]}
else if(t==2){b=r(1,30);a=r(2,25);x=a+b;q="x − "+a+" = "+b;s=["x = "+b+" + "+a,"x = "+x]}
else if(t==3){a=r(2,12);x=r(2,20);q=a+"x = "+a*x;s=["x = "+a*x+" : "+a,"x = "+x]}

L[1].gen=function(){var t=r(0,4),a=r(2,12),x=r(1,25),b=r(1,40),c,f=t==1;

L[2].gen=function(){var x=r(1,20),c=r(1,9),k=r(1,9),b=r(1,40),a=c+k,d=k*x+b;return{q:a+"x + "+b+" = "+(r(0,1)?d+" + "+co(c):co(c)+" + "+d),x:x,s:tr([a+"x − "+co(c)+" = "+d+" − "+b,co(k)+" = "+(d-b),"x = "+(d-b)+" : "+k+" = "+x],k)}};

L[4].gen=function(){for(;;){var x=r(1,15),m=r(3,9),n=r(2,m-1),p=r(1,8),q=r(1,9),mi=r(0,1),k=m-n,N=k*x+m*p,rr=mi?n*q-N:N-n*q,o=mi?"−":"+";if(rr>0&&rr<40)return{q:m+"(x + "+p+") = "+n+"(x + "+q+") "+o+" "+rr,x:x,s:tr([m+"x + "+m*p+" = "+n+"x + "+n*q+" "+o+" "+rr,m+"x + "+m*p+" = "+n+"x + "+N,co(k)+" = "+N+" − "+m*p,co(k)+" = "+k*x,"x = "+k*x+" : "+k+" = "+x],k)}}};
L[5].gen=function(){for(;;){var x=r(1,15),m=r(3,9),n=r(2,m-1),p=r(1,8),q=r(1,6),sw=r(0,1),k=sw?m*p+n*q:m*p-n*q,c=(m-n)*x+k;if(k>0&&c<150)return{q:m+"(x + "+p+") − "+n+"(x "+(sw?"−":"+")+" "+q+") = "+c,x:x,s:tr([m+"x + "+m*p+" − "+n+"x "+(sw?"+":"−")+" "+n*q+" = "+c,co(m-n)+" + "+k+" = "+c,co(m-n)+" = "+c+" − "+k,co(m-n)+" = "+(m-n)*x,"x = "+(m-n)*x+" : "+(m-n)+" = "+x],m-n)}}};
function nxt(i){var P,n=0,sn=(S.seen&&S.seen[i])||[];do{P=L[i].gen();n++}while(n<40&&(G.qs.indexOf(P.q)>=0||sn.indexOf(P.q)>=0||(n<25&&G.xs.indexOf(P.x)>=0)));G.qs.push(P.q);G.xs.push(P.x);if(!S.seen)S.seen={};S.seen[i]=sn;sn.push(P.q);if(sn.length>120)sn.shift();return P}
